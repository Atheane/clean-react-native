image: node:18.17.0

variables:
  EXPO_TOKEN: ${EXPO_TOKEN}
  IOS_DIST_CERT_BASE64: ${IOS_DIST_CERT_BASE64}
  IOS_PROVISION_PROFILE_BANK_APP_BASE64: ${IOS_PROVISION_PROFILE_BANK_APP_BASE64}
  IOS_PROVISION_PROFILE_ENERGY_APP_BASE64: ${IOS_PROVISION_PROFILE_ENERGY_APP_BASE64}
  IOS_CERT_PASSWORD: ${IOS_CERT_PASSWORD}
  CHROMATIC_PROJECT_TOKEN: ${CHROMATIC_PROJECT_TOKEN}

stages:
  - install
  - test
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - dist/
    - .nx/cache

install_dependencies:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
      - .nx/
      - tools/
      - tsconfig.base.json
      - nx.json
      - package.json
      - package-lock.json

test:
  stage: test
  script:
    - npm run test
  dependencies:
    - install_dependencies

.setup_ios_credentials: &setup_ios_credentials
  - echo "Setting up Expo configuration..."
  - mkdir -p ~/.expo
  - echo '{"accessToken":"'$EXPO_TOKEN'"}' > ~/.expo/state.json
  - chmod 600 ~/.expo/state.json
  - echo "Verifying Expo authentication..."
  - npx eas whoami

.setup_bank-app_credentials: &setup_bank-app_credentials
  before_script:
    - *setup_ios_credentials
    - |
      mkdir -p apps/bank-app/credentials/ios
      echo "$IOS_DIST_CERT_BASE64" | base64 -d > apps/bank-app/credentials/ios/dist-cert.p12
      echo "$IOS_PROVISION_PROFILE_BANK_APP_BASE64" | base64 -d > apps/bank-app/credentials/ios/profile.mobileprovision
      cat > apps/bank-app/credentials.json << EOL
      {
        "ios": {
          "distributionCertificate": {
            "path": "credentials/ios/dist-cert.p12",
            "password": "$IOS_CERT_PASSWORD"
          },
          "provisioningProfilePath": "credentials/ios/profile.mobileprovision"
        }
      }
      EOL

.setup_energy-app_credentials: &setup_energy-app_credentials
  before_script:
    - *setup_ios_credentials
    - |
      mkdir -p apps/energy-app/credentials/ios
      echo "$IOS_DIST_CERT_BASE64" | base64 -d > apps/energy-app/credentials/ios/dist-cert.p12
      echo "$IOS_PROVISION_PROFILE_ENERGY_APP_BASE64" | base64 -d > apps/energy-app/credentials/ios/profile.mobileprovision
      cat > apps/energy-app/credentials.json << EOL
      {
        "ios": {
          "distributionCertificate": {
            "path": "credentials/ios/dist-cert.p12",
            "password": "$IOS_CERT_PASSWORD"
          },
          "provisioningProfilePath": "credentials/ios/profile.mobileprovision"
        }
      }
      EOL

.build_template: &build_template
  variables:
    CI: "1"
    EAS_NO_VCS: "1"
    EAS_NO_INTERACTIVE: "1"
    EAS_PROJECT_ROOT: $CI_PROJECT_DIR
    EXPO_DEBUG: "1"
  dependencies:
    - install_dependencies

build_energy-app:
  stage: build
  <<: *setup_energy-app_credentials
  <<: *build_template
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building EnergyApp..."
    - npx nx build energy-app --platform ios --profile preview --non-interactive
  after_script:
    - rm -rf apps/energy-app/credentials
    - rm -f apps/energy-app/credentials.json

build_bank-app:
  stage: build
  <<: *setup_bank-app_credentials
  <<: *build_template
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building BankApp..."
    - npx nx build bank-app --platform ios --profile preview --non-interactive
  after_script:
    - rm -rf apps/bank-app/credentials
    - rm -f apps/bank-app/credentials.json

build_storybook:
  stage: build  
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building Storybook..."
    - npx nx build-storybook ui-mobile
  dependencies:
  - install_dependencies

chromatic_deployment:
  stage: deploy
  script:
    - echo "Deploying to Chromatic..."
    - echo "CHROMATIC_PROJECT_TOKEN" $CHROMATIC_PROJECT_TOKEN
    - npx nx chromatic ui-mobile --exit-once-uploaded
  dependencies:
    - install_dependencies
    - build_storybook