image: node:18.18.0

variables:
  EXPO_TOKEN: ${EXPO_TOKEN}
  IOS_DIST_CERT_BASE64: ${IOS_DIST_CERT_BASE64}
  IOS_PROVISION_PROFILE_BASE64: ${IOS_PROVISION_PROFILE_BASE64}
  IOS_CERT_PASSWORD: ${IOS_CERT_PASSWORD}
  CHROMATIC_PROJECT_TOKEN: ${CHROMATIC_PROJECT_TOKEN}

stages:
  - install
  - test
  - build_storybook
  - UI_Tests
  - build_apps

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .yarn/
    - dist/
    - .nx/cache

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_REF_NAME == "main"
      when: always

install_dependencies:
  stage: install
  script:
    - yarn install
  artifacts:
    paths:
      - node_modules/
      - .nx/
      - tools/
      - tsconfig.base.json
      - nx.json
      - package.json
      - yarn.lock

test:
  stage: test
  script:
    - yarn test
  dependencies:
    - install_dependencies

build_storybook:
  stage: build_storybook
  variables:
    CI: '1'
    EAS_NO_VCS: '1'
    EAS_NO_INTERACTIVE: '1'
    EAS_PROJECT_ROOT: $CI_PROJECT_DIR
    EXPO_DEBUG: '1'
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building Storybook..."
    - npx nx build-storybook ui-mobile
  artifacts:
    paths:
      - dist/storybook/ui-mobile/
  dependencies:
    - install_dependencies

chromatic_deployment:
  stage: UI_Tests
  script:
    - echo "Deploying to Chromatic..."
    - echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - echo "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if [ -n "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" ] && [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        npx nx chromatic ui-mobile \
          --exit-once-uploaded \
          --patch-build="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME...$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        npx nx chromatic ui-mobile \
          --exit-once-uploaded \
          --storybook-build-dir=dist/storybook/ui-mobile
      fi
  dependencies:
    - install_dependencies
    - build_storybook

.setup_credentials: &setup_credentials
  - echo "Setting up Expo configuration..."
  - npm install -g eas-cli
  - mkdir -p ~/.expo
  - echo '{"accessToken":"'$EXPO_TOKEN'"}' > ~/.expo/state.json
  - chmod 600 ~/.expo/state.json
  - echo "Verifying Expo authentication..."
  - eas whoami

.bank-app_credentials: &bank-app_credentials
  before_script:
    - *setup_credentials
    - |
      mkdir -p apps/bank-app/credentials/ios
      echo "$IOS_DIST_CERT_BASE64" | base64 -d > apps/bank-app/credentials/ios/dist-cert.p12
      echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > apps/bank-app/credentials/ios/profile.mobileprovision
      cat > apps/bank-app/credentials.json << EOL
      {
        "ios": {
          "distributionCertificate": {
            "path": "credentials/ios/dist-cert.p12",
            "password": "$IOS_CERT_PASSWORD"
          },
          "provisioningProfilePath": "credentials/ios/profile.mobileprovision"
        }
      }
      EOL

.energy-app_credentials: &energy-app_credentials
  before_script:
    - *setup_credentials
    - |
      mkdir -p apps/energy-app/credentials/ios
      echo "$IOS_DIST_CERT_BASE64" | base64 -d > apps/energy-app/credentials/ios/dist-cert.p12
      echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > apps/energy-app/credentials/ios/profile.mobileprovision
      cat > apps/energy-app/credentials.json << EOL
      {
        "ios": {
          "distributionCertificate": {
            "path": "credentials/ios/dist-cert.p12",
            "password": "$IOS_CERT_PASSWORD"
          },
          "provisioningProfilePath": "credentials/ios/profile.mobileprovision"
        }
      }
      EOL

build_bank-app_ios:
  stage: build_apps
  <<: *bank-app_credentials
  variables:
    CI: '1'
    EAS_NO_VCS: '1'
    EAS_NO_INTERACTIVE: '1'
    EAS_PROJECT_ROOT: $CI_PROJECT_DIR
    EXPO_DEBUG: '1'
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building BankApp..."
    - npx nx build bank-app --platform ios --profile preview --non-interactive
  after_script:
    - rm -rf apps/bank-app/credentials
    - rm -f apps/bank-app/credentials.json
  dependencies:
    - install_dependencies

build_bank-app_android:
  stage: build_apps
  variables:
    CI: '1'
    EAS_NO_VCS: '1'
    EAS_NO_INTERACTIVE: '1'
    EAS_PROJECT_ROOT: $CI_PROJECT_DIR
    EXPO_DEBUG: '1'
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building BankApp..."
    - npx nx build bank-app --platform android --profile preview --non-interactive
  dependencies:
    - install_dependencies

build_energy-app_ios:
  stage: build_apps
  <<: *energy-app_credentials
  variables:
    CI: '1'
    EAS_NO_VCS: '1'
    EAS_NO_INTERACTIVE: '1'
    EAS_PROJECT_ROOT: $CI_PROJECT_DIR
    EXPO_DEBUG: '1'
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building App 450..."
    - npx nx build energy-app --platform ios --profile preview --non-interactive
  after_script:
    - rm -rf apps/energy-app/credentials
    - rm -f apps/energy-app/credentials.json
  dependencies:
    - install_dependencies

build_energy-app_android:
  stage: build_apps
  variables:
    CI: '1'
    EAS_NO_VCS: '1'
    EAS_NO_INTERACTIVE: '1'
    EAS_PROJECT_ROOT: $CI_PROJECT_DIR
    EXPO_DEBUG: '1'
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building App 450..."
    - npx nx build energy-app --platform android --profile preview --non-interactive
  dependencies:
    - install_dependencies
